name: Extract and Setup
on:
  push:
    paths:
      - '.github/workflows/setup.yml'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Extract ZIP
        run: |
          unzip loonars-dashboard.zip -d extracted
          cp -r extracted/loonars-dashboard/. .
          rm -rf extracted loonars-dashboard.zip

      - name: Commit files
        run: |
          git config user.email "loonarsliving@gmail.com"
          git config user.name "loonarsliving"
          git add .
          git commit -m "feat: setup project structure" || echo "nothing to commit"
          git push
