name: Extract and Setup
on:
  push:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get ZIP from git history and extract
        run: |
          git show fd3c69b:loonars-dashboard.zip > loonars-dashboard.zip
          unzip -o loonars-dashboard.zip
          cp -r loonars-dashboard/. .
          rm -rf loonars-dashboard loonars-dashboard.zip

      - name: Commit proper structure
        run: |
          git config user.email "loonarsliving@gmail.com"
          git config user.name "loonarsliving"
          git add .
          git commit -m "feat: proper project structure" || echo "nothing to commit"
          git push
